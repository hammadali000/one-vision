<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career</title>
    <link rel="stylesheet" href="careeestyle.css">
</head>
<body>

    <div class="container">
        <div class="apply-box"><h1>Apply for Desired Job</h1>
        <!-- <form action=""> -->
            <form action="https://formspree.io/f/xpwpolnk" method="POST">

            
            <div class="form-conatiner">
                <div class="form-control">
                    <label for="first-name">First Name</label>
                    <input type="text" id="First-Name" name="first-name" placeholder="First Name" required>
       
                </div>

                <div class="form-control">
                    <label for="last-name">First Name</label>
                    <input type="text" id="last-Name" name="last-name" placeholder="Last Name" required>
       
                </div>
                <div class="form-control">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your Email" required>
       
                </div>
                <div class="form-control">
                    <label for="job-role">Apply For</label>
                    <select name="jon-role" id="job-role" required>
                        <option value="">Select Job Role</option>
                        <option value="general-manager">GENERAL MANAGER</option>
                        <option value="assistant-general-manager">ASSISTANT GENERAL MANAGER</option>
                        <option value="HRM">HRM</option>
                        <option value="Accoutant">ACCOUTANT</option>
                        <option value="DOCUMENT-Controller">DOCUMENT CONTROLLER</option>
                        <option value="recep">RECEPTIONIST</option>
                        <option value="market">MARKETING MANAGER</option>
                        <option value="computer-operator-I">COMPUTER OPERATOR I</option>
                        <option value="computer-operator-II">COMPUTER OPERATOR II</option>
                        <option value="computer-operator-III">COMPUTER OPERATOR III</option>
                        <option value="sales-man-I">SALES MAN I</option>
                        <option value="sales-man-II">SALES MAN II</option>
                        <option value="sales-man-III">SALES MAN III</option>
                        <option value="driver">DRIVER</option>
                        <option value="cook">COOK</option>
                        <option value="office-boy">OFFICE BOY</option>
                        <option value="Security">SECURITY GUARD</option>
                        <option value="sweaper">SWEAPER</option>



                    </select>
       
                </div>
                <div class="textarea-control">
                    <label for="adress">Addres</label>
                    <textarea name="adress" id="text"  placeholder="Enter Your Address" required></textarea>
       
                </div>
                <div class="form-control">
                    <label for="city">City</label>
                    <input type="city" id="city" name="city" placeholder="Enter your City Name" required>
                         
                </div>
                <div class="form-control">
                    <label for="number">Phone No</label>
                    <input type="number" id="code" name="code" placeholder="Enter your Phone No" required>
                         
                </div>
                <div class="form-control">
                    <label for="date">Date Of Birth</label>
                    <input type="date" id="date" name="date"  required>
                         
                </div>
                <div class="form-control">
                    <label for="upload">Upload Your Cv</label>
                    <input type="file" id="upload" name="upload" required>
                         
                </div>
            </div>
            <div class="button-container">
                <button type="submit">Apply Now</button>
            </div>
        </form>
    </div>

    </div>
    
</body>
</html>
